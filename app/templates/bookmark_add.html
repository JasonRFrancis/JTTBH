<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Bookmark</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           font-size: 15px; margin: 0; padding: 16px; background: #fff; color: #1a1a1a; }
    h1 { font-size: 1.1rem; margin: 0 0 16px; }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 0.8rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: .04em;
            color: #666; margin-bottom: 4px; }
    input[type=url], input[type=text], textarea {
      width: 100%; padding: 7px 10px; border: 1px solid #ccc;
      border-radius: 4px; font-size: 14px; font-family: inherit; }
    textarea { resize: vertical; min-height: 60px; }
    .check-row { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    button[type=submit] {
      flex: 1; padding: 9px; background: #2563eb; color: #fff;
      border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
    button[type=submit]:hover { background: #1d4ed8; }
    button[type=button] {
      padding: 9px 16px; background: #f3f4f6; color: #374151;
      border: 1px solid #d1d5db; border-radius: 4px; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Add Bookmark</h1>
  <form method="post" action="{{ url_for('bookmark.create', username=username) }}">
    <input type="hidden" name="popup" value="1">

    <div class="field">
      <label for="bm-url">URL</label>
      <input type="url" id="bm-url" name="url" required value="{{ url }}" autocomplete="off">
    </div>

    <div class="field">
      <label for="bm-title">Title</label>
      <input type="text" id="bm-title" name="title" value="{{ title }}" autocomplete="off">
    </div>

    <div class="field">
      <label for="bm-tags-input">Tags <span style="font-weight:400;text-transform:none;">(press comma or space to add)</span></label>
      <div class="bm-tag-chips-field" onclick="this.querySelector('.bm-tag-chips-input').focus()">
        <span class="bm-tag-chips-list"></span>
        <input class="bm-tag-chips-input" type="text" id="bm-tags-input" placeholder="Add tag…" autocomplete="off" spellcheck="false">
        <input type="hidden" id="bm-tags" name="tags" class="bm-tags-hidden" value="">
      </div>
    </div>

    <div class="field">
      <label for="bm-desc">Description</label>
      <input type="text" id="bm-desc" name="description" autocomplete="off">
    </div>

    <div class="field">
      <label for="bm-notes">Notes</label>
      <textarea id="bm-notes" name="notes"></textarea>
    </div>

    <div class="field">
      <div class="check-row">
        <input type="checkbox" id="bm-later" name="read_later" value="1">
        <label for="bm-later" style="text-transform:none;letter-spacing:0;color:#1a1a1a;font-weight:400;margin:0">
          Read later
        </label>
      </div>
    </div>

    <div class="actions">
      <button type="submit">Save</button>
      <button type="button" onclick="window.close()">Cancel</button>
    </div>
  </form>
<style>
  .bm-tag-chips-field { display:flex; flex-wrap:wrap; align-items:center; gap:0.4rem; padding:0.35rem 0.5rem; border:1px solid #ccc; border-radius:4px; min-height:2.2rem; cursor:text; }
  .bm-tag-chip-item { display:inline-flex; align-items:center; gap:0.2rem; padding:0.15rem 0.5rem; background:#e8f0fe; color:#2563eb; border-radius:999px; font-size:0.8rem; font-weight:500; }
  .bm-tag-chip-remove { background:none; border:none; cursor:pointer; color:inherit; padding:0 0.1rem; font-size:0.9rem; }
  .bm-tag-chips-input { border:none; outline:none; padding:0; font-size:14px; flex:1; min-width:80px; background:transparent; }
  .bm-tag-chips-list { display:contents; }
</style>
<script>
(function(){
  const field = document.querySelector('.bm-tag-chips-field');
  if(!field) return;
  const hidden = field.querySelector('.bm-tags-hidden');
  const input = field.querySelector('.bm-tag-chips-input');
  const list = field.querySelector('.bm-tag-chips-list');
  function getTags(){ return hidden.value ? hidden.value.split(',').map(t=>t.trim()).filter(Boolean) : []; }
  function render(tags){ list.innerHTML=''; tags.forEach(t=>{ const c=document.createElement('span'); c.className='bm-tag-chip-item'; c.textContent=t; const b=document.createElement('button'); b.type='button'; b.className='bm-tag-chip-remove'; b.textContent='×'; b.onclick=()=>{ update(getTags().filter(x=>x!==t)); }; c.appendChild(b); list.appendChild(c); }); }
  function update(tags){ const u=[...new Set(tags.map(t=>t.replace(/\s+/g,'').trim()).filter(Boolean))]; hidden.value=u.join(','); render(u); }
  update(getTags());
  input.addEventListener('keydown', e=>{ if(e.key===','||e.key===' '||e.key==='Enter'){ e.preventDefault(); const v=input.value.replace(/[, ]+/g,'').trim(); if(v){ const t=getTags(); if(!t.includes(v))t.push(v); update(t); input.value=''; } } if(e.key==='Backspace'&&!input.value){ const t=getTags(); if(t.length)update(t.slice(0,-1)); } });
  input.addEventListener('blur', ()=>{ const v=input.value.replace(/[, ]+/g,'').trim(); if(v){ const t=getTags(); if(!t.includes(v))t.push(v); update(t); input.value=''; } });
})();
</script>
</body>
</html>
