{% extends 'base.html' %}

{% block title %}403 Forbidden - jttbh{% endblock %}

{% block content %}
<article class="error-page">
  <header>
    <h1>403</h1>
    <p class="error-subtitle">Access Denied</p>
  </header>
  <section>
    <p>You do not have permission to access this page.</p>
    {% if session.get('user_id') %}
    <p>
      <a href="{{ url_for('dashboard.index', username=session.username) }}">Return to Dashboard</a>
    </p>
    {% else %}
    <p>
      <a href="{{ url_for('auth.login') }}">Sign in</a>
    </p>
    {% endif %}
  </section>
</article>
{% endblock %}
