{% extends 'base.html' %}

{% block title %}404 Not Found - jttbh{% endblock %}

{% block content %}
<article class="error-page">
  <header>
    <h1>404</h1>
    <p class="error-subtitle">Page Not Found</p>
  </header>
  <section>
    <p>The page you are looking for does not exist or has been moved.</p>
    {% if session.get('user_id') %}
    <p>
      <a href="{{ url_for('dashboard.index', username=session.username) }}">Return to Dashboard</a>
    </p>
    {% else %}
    <p>
      <a href="{{ url_for('auth.login') }}">Sign in</a>
    </p>
    {% endif %}
  </section>
</article>
{% endblock %}
