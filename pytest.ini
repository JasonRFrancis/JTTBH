[pytest]
# Pytest configuration for JTTBH test suite

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = test

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-branch

# Coverage options
[coverage:run]
source = app
omit =
    */tests/*
    */test_*.py
    */__init__.py
    */config/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

# Markers
markers =
    unit: Unit tests (fast, mocked dependencies)
    integration: Integration tests (slower, use database)
    slow: Slow-running tests
    requires_db: Tests that require database connection
